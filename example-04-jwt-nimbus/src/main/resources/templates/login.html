<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập JWT - Góc Sách</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><header class="brand"><span>📚</span><h1>Góc Sách</h1><p>Ví dụ xác thực JWT bằng Nimbus</p></header><section class="card auth-grid"><form id="loginForm" class="panel"><h2>Đăng nhập</h2><p class="note">Dùng tài khoản mẫu hoặc tài khoản vừa đăng ký.</p><label for="loginEmail">Email</label><input id="loginEmail" type="email" value="admin@gocsach.vn" required autocomplete="username"><label for="loginPassword">Mật khẩu</label><input id="loginPassword" type="password" value="123456" required autocomplete="current-password"><button type="submit">Đăng nhập</button><div id="loginMessage" class="message" role="status"></div></form><form id="registerForm" class="panel"><h2>Tạo tài khoản</h2><label for="fullName">Họ và tên</label><input id="fullName" required maxlength="100"><label for="registerEmail">Email</label><input id="registerEmail" type="email" required autocomplete="email"><label for="registerPassword">Mật khẩu</label><input id="registerPassword" type="password" minlength="6" maxlength="72" required autocomplete="new-password"><button type="submit">Đăng ký</button><div id="registerMessage" class="message" role="status"></div></form></section></main><script src="/js/main.js"></script></body></html>
