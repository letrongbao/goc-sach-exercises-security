<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><style>body{font-family:system-ui;background:#f5f0e6;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:2rem;border-radius:16px;width:min(360px,90vw)}input,button{box-sizing:border-box;width:100%;padding:.8rem;margin:.45rem 0}button{background:#245c4b;color:#fff;border:0}</style></head><body><form class="box" th:action="@{/login}" method="post"><h1>Đăng nhập</h1><p>Dùng tên tài khoản hoặc email</p><p th:if="${param.error}" style="color:#b42318">Thông tin đăng nhập chưa đúng.</p><input name="login" placeholder="Tên tài khoản hoặc email" required autofocus><input name="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button></form></body></html>
