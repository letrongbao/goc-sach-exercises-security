<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title layout:title-pattern="$CONTENT_TITLE - Góc Sách">Góc Sách</title><style>body{font-family:system-ui;margin:0;background:#f8f4ea;color:#183b32}header{display:flex;align-items:center;justify-content:space-between;padding:1rem 5%;background:#245c4b;color:white}.profile{display:flex;align-items:center;gap:.6rem}.profile img{width:38px;height:38px;border-radius:50%}main{max-width:960px;margin:2rem auto;padding:2rem;background:white;border-radius:16px}a{color:inherit}</style></head><body><header><strong>Góc Sách</strong><div class="profile" sec:authorize="isAuthenticated()"><img th:src="${#authentication.principal.image}" alt="Ảnh đại diện"><span th:text="${#authentication.principal.fullName}"></span><form th:action="@{/logout}" method="post"><button>Đăng xuất</button></form></div></header><main layout:fragment="content"></main></body></html>
