<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Sản phẩm</title></head><body><section layout:fragment="content"><div class="toolbar"><form method="get" th:action="@{/products}" style="display:flex;gap:.5rem;flex:1"><input name="q" th:value="${q}" placeholder="Tìm sản phẩm"><button>Tìm</button></form><a class="btn" th:href="@{/products/new}">Thêm sản phẩm</a></div><div class="grid"><article class="card book" th:each="p:${result.content}"><img th:src="${#strings.isEmpty(p.imageUrl) ? 'https://placehold.co/600x450?text=Goc+Sach' : p.imageUrl}" alt="Ảnh sản phẩm"><h2 th:text="${p.name}"></h2><p th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')}+' đ'"></p><small th:text="'Người đăng: '+${p.owner.fullName}"></small><p><a class="btn" th:href="@{/products/{id}/edit(id=${p.id})}">Sửa</a></p><form th:action="@{/products/{id}/delete(id=${p.id})}" method="post"><button class="danger">Xóa</button></form></article></div><p th:if="${result.empty}">Chưa có sản phẩm phù hợp.</p><div class="pagination"><a class="btn" th:if="${result.hasPrevious()}" th:href="@{/products(q=${q},page=${result.number-1})}">Trang trước</a><span th:text="'Trang '+${result.number+1}+'/'+${result.totalPages}"></span><a class="btn" th:if="${result.hasNext()}" th:href="@{/products(q=${q},page=${result.number+1})}">Trang sau</a></div></section></body></html>
