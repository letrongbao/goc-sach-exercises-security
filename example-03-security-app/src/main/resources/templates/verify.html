<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xác nhận tài khoản</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container"><form class="card auth" method="post" th:action="@{/verify}"><h1>Xác nhận tài khoản</h1><div th:if="${message}" class="alert" th:text="${message}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><input name="email" type="email" th:value="${email}" required><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Mã xác nhận 6 số" required><button>Xác nhận</button></form></main></body></html>
