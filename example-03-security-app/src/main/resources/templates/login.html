<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container"><form class="card auth" method="post" th:action="@{/login}"><h1>Đăng nhập</h1><p>Dùng tên tài khoản hoặc email.</p><div th:if="${message}" class="alert" th:text="${message}"></div><div th:if="${param.error}" class="alert error">Thông tin đăng nhập chưa đúng hoặc tài khoản chưa được xác nhận.</div><input name="login" placeholder="Tên tài khoản hoặc email" required autofocus><input name="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button><p><a th:href="@{/register}">Tạo tài khoản</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a></p></form></main></body></html>
