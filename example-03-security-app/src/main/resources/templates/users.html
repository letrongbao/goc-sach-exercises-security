<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Người dùng</title></head><body><section layout:fragment="content"><h1>Danh sách người dùng</h1><div class="card"><table><thead><tr><th>Tài khoản</th><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="u:${result.content}"><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.role}"></td><td th:text="${u.enabled?'Đã xác nhận':'Chờ xác nhận'}"></td></tr></tbody></table></div></section></body></html>
