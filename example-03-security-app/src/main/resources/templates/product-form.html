<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head><title>Sản phẩm</title></head><body><section layout:fragment="content"><form class="card auth" th:action="@{/products/save}" method="post"><h1 th:text="${product==null?'Thêm sản phẩm':'Sửa sản phẩm'}"></h1><input type="hidden" name="id" th:value="${product?.id}"><input name="name" placeholder="Tên sản phẩm" th:value="${product?.name}" required><textarea name="description" placeholder="Mô tả" th:text="${product?.description}"></textarea><input name="price" type="number" min="0" step="1000" placeholder="Giá bán" th:value="${product?.price}" required><input name="imageUrl" type="url" placeholder="Đường dẫn ảnh" th:value="${product?.imageUrl}"><button>Lưu sản phẩm</button></form></section></body></html>
