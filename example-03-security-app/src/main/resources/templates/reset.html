<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container"><form class="card auth" method="post" th:action="@{/reset-password}"><h1>Đặt lại mật khẩu</h1><div th:if="${message}" class="alert" th:text="${message}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><input name="email" type="email" th:value="${email}" required><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Mã xác nhận" required><input name="password" type="password" minlength="6" placeholder="Mật khẩu mới" required><button>Đổi mật khẩu</button></form></main></body></html>
