<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="container"><form class="card auth" method="post" th:action="@{/register}"><h1>Tạo tài khoản</h1><div th:if="${error}" class="alert error" th:text="${error}"></div><input name="fullName" placeholder="Họ và tên" required><input name="username" placeholder="Tên tài khoản" required minlength="3"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Mật khẩu" required minlength="6"><button>Đăng ký</button><p><a th:href="@{/login}">Quay lại đăng nhập</a></p></form></main></body></html>
